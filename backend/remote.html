<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Signal Remote</title>
<style>
  :root {
    --bg: #0B0D10; --panel: #12151A; --border: #20242B; --text: #E6E9EE; --muted: #8A93A0;
    --stop: #EF4444; --go: #22C55E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); gap: 16px;
    user-select: none; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .link { font: 12px "JetBrains Mono", ui-monospace, monospace; padding: 4px 10px; border-radius: 999px;
    background: rgba(239,68,68,.15); color: var(--stop); }
  .link.ok { background: rgba(34,197,94,.15); color: var(--go); }
  .tiles { flex: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 16px; min-height: 0; }
  .tile { position: relative; border: 1px solid var(--border); border-radius: 24px; background: var(--panel);
    color: var(--text); display: flex; align-items: center; gap: 20px; padding: 24px; text-align: left;
    font: inherit; cursor: pointer; transition: transform .08s, border-color .2s, background .2s; }
  .tile:active { transform: scale(.98); }
  .tile:disabled { opacity: .45; }
  .lamp { width: 72px; height: 72px; flex: none; border-radius: 50%; background: #2A2F37;
    transition: background .2s, box-shadow .2s; }
  .tile.on { border-color: rgba(239,68,68,.5); background: linear-gradient(135deg, rgba(239,68,68,.12), var(--panel) 60%); }
  .tile.on .lamp { background: var(--stop); box-shadow: 0 0 32px 6px rgba(239,68,68,.55); }
  .name { font-size: 28px; font-weight: 700; }
  .state { margin-top: 4px; font: 14px "JetBrains Mono", ui-monospace, monospace; color: var(--muted); }
  .tile.on .state { color: var(--stop); }
  .pending::after { content: ""; position: absolute; inset: 0; border-radius: 24px;
    border: 2px solid rgba(56,189,248,.6); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row button { border: 1px solid var(--border); border-radius: 16px; background: var(--panel); color: var(--text);
    font-family: inherit; font-size: 16px; font-weight: 600; padding: 18px; cursor: pointer; }
  .row button:active { transform: scale(.98); }
  .row button:disabled { opacity: .45; }
  .msg { min-height: 18px; text-align: center; font-size: 13px; color: var(--stop); }
</style>
</head>
<body>
  <header>
    <h1>Signal Remote</h1>
    <span id="link" class="link">Connecting…</span>
  </header>

  <div class="tiles">
    <button class="tile" id="tileA" data-lane="a" disabled>
      <span class="lamp"></span>
      <span><div class="name">LED A</div><div class="state">—</div></span>
    </button>
    <button class="tile" id="tileB" data-lane="b" disabled>
      <span class="lamp"></span>
      <span><div class="name">LED B</div><div class="state">—</div></span>
    </button>
  </div>

  <div class="row">
    <button id="allOn" disabled>Both on</button>
    <button id="allOff" disabled>Both off</button>
  </div>
  <div class="msg" id="msg"></div>

<script>
  // LED state as last reported by the device (1 = on). null = unknown.
  let leds = null;
  let busy = false;
  const $ = (id) => document.getElementById(id);

  function render(connected) {
    $("link").textContent = connected ? "Connected" : "No device";
    $("link").classList.toggle("ok", connected);
    const ready = connected && leds !== null && !busy;
    for (const [id, key] of [["tileA", "a"], ["tileB", "b"]]) {
      const tile = $(id);
      tile.disabled = !ready;
      const on = leds ? leds[key] === 1 : false;
      tile.classList.toggle("on", on);
      tile.querySelector(".state").textContent = leds === null ? "—" : on ? "ON" : "OFF";
    }
    $("allOn").disabled = !ready;
    $("allOff").disabled = !ready;
  }

  let connected = false;
  async function poll() {
    try {
      const res = await fetch("/api/status", { cache: "no-store" });
      const s = await res.json();
      const age = s.link.last_packet_age;
      connected = s.link.connected && s.link.booted && age !== null && age < 1.5;
      const t = s.telemetry;
      if (!busy) leds = t && t.la !== undefined ? { a: t.la, b: t.lb } : null;
    } catch {
      connected = false;
    }
    render(connected);
  }

  async function send(a, b, tile) {
    if (busy) return;
    busy = true;
    $("msg").textContent = "";
    if (tile) tile.classList.add("pending");
    const prev = leds;
    leds = { a, b };  // show it straight away; the next poll confirms from the device
    render(connected);
    try {
      const res = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cmd: `L:${a}${b}` }),
      });
      const body = await res.json();
      if (!body.ok) { leds = prev; $("msg").textContent = `Not applied (${body.error || "error"})`; }
    } catch {
      leds = prev;
      $("msg").textContent = "Not applied (network)";
    }
    if (tile) tile.classList.remove("pending");
    busy = false;
    render(connected);
  }

  $("tileA").onclick = () => leds && send(leds.a ? 0 : 1, leds.b, $("tileA"));
  $("tileB").onclick = () => leds && send(leds.a, leds.b ? 0 : 1, $("tileB"));
  $("allOn").onclick = () => send(1, 1, null);
  $("allOff").onclick = () => send(0, 0, null);

  poll();
  setInterval(poll, 400);
</script>
</body>
</html>
